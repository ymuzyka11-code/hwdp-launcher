name: Windows installer

on:
  push:
    branches:
      - dev/developer-preview
      - release/microsoft-launcher-integration
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build HWDP Launcher installer (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        run: npx tauri build --bundles nsis

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWDP-Launcher-Windows-x64-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish developer preview release
        if: github.ref == 'refs/heads/dev/developer-preview'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: developer-preview
          name: HWDP Launcher – Developer Preview
          prerelease: true
          make_latest: false
          generate_release_notes: true
          overwrite_files: true
          files: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish latest launcher preview
        if: github.ref == 'refs/heads/release/microsoft-launcher-integration'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-preview
          name: HWDP Launcher – Latest Windows Preview
          prerelease: true
          make_latest: false
          generate_release_notes: false
          overwrite_files: true
          files: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: HWDP Launcher ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: src-tauri/target/release/bundle/nsis/*.exe
