name: Windows installer and signed updater

on:
  push:
    branches:
      - dev/developer-preview
      - release/microsoft-launcher-integration
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build signed HWDP Launcher updater (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Build signed Windows NSIS installer and updater bundle
        run: npx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate updater manifest
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter "*.exe" | Where-Object { $_.Name -notlike "*-setup-helper.exe" } | Select-Object -First 1
          if (-not $installer) { throw "Tauri NSIS installer was not produced." }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw "Updater signature is missing: $signaturePath" }
          $signature = (Get-Content $signaturePath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw "Updater signature is empty: $signaturePath" }
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if ("${{ github.ref }}" -eq "refs/heads/dev/developer-preview") {
            $releaseTag = "developer-preview"
          } elseif ("${{ github.ref }}" -eq "refs/heads/release/microsoft-launcher-integration") {
            $releaseTag = "launcher-preview"
          } else {
            $releaseTag = "${{ github.ref_name }}"
          }
          $manifest = @{
            version = $version
            notes = "HWDP Launcher update"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/ymuzyka11-code/hwdp-launcher/releases/download/$releaseTag/$($installer.Name)"
              }
            }
          } | ConvertTo-Json -Depth 8
          Set-Content -Path "$bundle/latest.json" -Value $manifest -Encoding utf8

      - name: Upload installer and updater files
        uses: actions/upload-artifact@v4
        with:
          name: HWDP-Launcher-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish developer preview
        if: github.ref == 'refs/heads/dev/developer-preview'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: developer-preview
          name: HWDP Launcher – Developer Preview
          prerelease: true
          make_latest: false
          generate_release_notes: true
          overwrite_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json

      - name: Publish latest launcher preview
        if: github.ref == 'refs/heads/release/microsoft-launcher-integration'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-preview
          name: HWDP Launcher – Latest Windows Preview
          prerelease: true
          make_latest: false
          generate_release_notes: false
          overwrite_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: HWDP Launcher ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
