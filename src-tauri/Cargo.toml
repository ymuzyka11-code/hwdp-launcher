[package]
name = "hwdp-launcher"
version = "0.3.0"
description = "HWDP Launcher"
authors = ["HWDP Launcher contributors"]
edition = "2024"

[lib]
name = "hwdp_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
crust_core = "1.0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sysinfo = "0.35"
sha1 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
